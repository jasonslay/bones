[package]
name = "bones"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Bones — a high-risk 5-dice multiplayer game"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bevy = { version = "0.19.1", default-features = false }
futures-util = "0.3"
rand = "0.10"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "bones"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
